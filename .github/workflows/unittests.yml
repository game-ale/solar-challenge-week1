name: Python CI

on:
  push:
    branches:
      - main
      - setup-task # Trigger on pushes to setup-task branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python 3.12.9
        uses: actions/setup-python@v2
        with:
          python-version: '3.12.9' # Using Python 3.12.9 as a modern standard

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python version check
        run: python --version
        